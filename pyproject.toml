[project]
name = "shopping-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Column-aligned seed data tables
"src/setup_db.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls the real Groq API (needs RUN_LIVE=1 and a real GROQ_API_KEY)",
    "browser: drives a real browser with Playwright (needs E2E_BASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]
