services:
  app:
    build: .
    image: shopping-agent
    ports:
      - "8501:8501"
    env_file: .env          # provides GROQ_API_KEY at runtime; never baked into the image
    volumes:
      - store-data:/app/data  # keeps store.db (and placed orders) across restarts and rebuilds
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  store-data:
